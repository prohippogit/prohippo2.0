# Builds the ProHippo Connector desktop app for macOS and Windows on GitHub's
# own runners (no local machine needed), then attaches the installers to a
# GitHub Release so the website can link to them.
#
# Trigger: push a tag like `connector-v1` (or run manually from the Actions tab).
name: Build ProHippo Connector

on:
  push:
    tags:
      - "connector-v*"
  workflow_dispatch: # lets you start a build by hand from the Actions tab

permissions:
  contents: write # needed to create/update the Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: connector
    env:
      # We drive the user's own Chrome at runtime, so no need to download a
      # browser at build time — keeps the build fast.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # Build unsigned (no Apple identity on the runner). Users get a one-time
      # OS warning until real signing certs are added.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Auto-update compares the INSTALLED app's package.json version against the
      # version recorded in latest*.yml. If the version never moves, no update is
      # ever offered — so the release tag is the single source of truth for it,
      # and a malformed tag fails the build rather than shipping a build nobody
      # can be upgraded from.
      - name: Set version from the release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#connector-v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' must be connector-vX.Y.Z so auto-update can compare versions (got '$VERSION'). Example: connector-v1.0.1"
            exit 1
          fi
          npm version --no-git-tag-version --allow-same-version "$VERSION"
          echo "Building connector $VERSION"

      # electron-builder downloads NSIS, winCodeSign and the Electron binary
      # itself from GitHub releases at build time. Those downloads are the least
      # reliable part of this workflow — a reset connection fails the job two
      # seconds in, with nothing wrong with the app — so keep them across runs.
      - name: Cache the electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('connector/package-lock.json', 'connector/package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm install

      # Bake the Google "Desktop app" OAuth client into the build so sign-in
      # works in the distributed app. Values come from repo secrets, never the
      # repo. (Installed-app secrets aren't confidential; PKCE protects sign-in.)
      - name: Write Google OAuth config
        shell: bash
        run: |
          printf '{ "clientId": "%s", "clientSecret": "%s" }\n' \
            "${GOOGLE_OAUTH_CLIENT_ID}" "${GOOGLE_OAUTH_CLIENT_SECRET}" > google-oauth.json
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

      # Retried, for the same reason the cache above exists: the failure mode is
      # "An existing connection was forcibly closed by the remote host" while
      # fetching a build tool, which says nothing about whether this build would
      # succeed. A cold cache plus a bad minute on GitHub's CDN should not cost a
      # release. With the cache warm a retry usually has nothing left to fetch.
      - name: Build installer
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npx electron-builder --publish never; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::electron-builder attempt $attempt failed — retrying in $((attempt * 20))s"
              sleep $((attempt * 20))
            fi
          done
          echo "::error::electron-builder failed three times. If every attempt shows a download error, it is GitHub's CDN; if it shows a build error, it is the app."
          exit 1

      - name: Attach installer to the Release
        uses: softprops/action-gh-release@v2
        with:
          # Always publish to ONE stable release, so the website can link a
          # permanent URL: releases/download/connector-latest/ProHippo-Connector-mac.dmg
          tag_name: connector-latest
          name: ProHippo Connector (latest)
          make_latest: true
          files: |
            connector/release/ProHippo-Connector-*.dmg
            connector/release/ProHippo-Connector-*.exe
            connector/release/*.blockmap
            connector/release/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
